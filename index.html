<!DOCTYPE html>
<html>
  <head>
    <title>Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        background: #0f172a;
        color: white;
        font-family: sans-serif;
        text-align: center;
        padding-top: 50px;
      }
      #status {
        font-size: 80px;
        font-weight: 900;
        color: #22d3ee;
      }
    </style>
  </head>
  <body>
    <h1>LIVE SCORE</h1>
    <div id="status">...</div>

    <script>
        const SB_URL = 'https://lissscvlvmzjswsykvoq.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxpc3NzY3Zsdm16anN3c3lrdm9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0ODAyNTAsImV4cCI6MjA5MDA1NjI1MH0.Muj9vosIuV1bFJQ5_iR9JkQ22gzvBcc70kbjnBFwBbM';
    
        // 1. Initialize with a unique name
        const receiverClient = supabase.createClient(SB_URL, SB_KEY);
    
        // 2. Start listening for changes
        receiverClient
          .channel('live-updates')
          .on(
            'postgres_changes',
            {
              event: 'UPDATE',
              schema: 'public',
              table: 'live_scores'
            },
            (payload) => {
              console.log('New data received:', payload);
              // Make sure your HTML has <h1 id="status">...</h1>
              const statusElement = document.getElementById('status');
              if (statusElement) {
                  statusElement.innerText = payload.new.score_value;
              }
            }
          )
          .subscribe((status) => {
            console.log("Subscription status:", status);
          });
    </script>
  </body>
</html>
