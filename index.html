<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #demo {
        font-size: 35vw;
        font-family: monospace;
      }
      #progress-bar {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 20px;
        background: #222;
      }
      #progress-done {
        height: 100%;
        background: #fff;
        width: 0%;
        transition: width 0.5s linear;
      }
    </style>
  </head>
  <body>
    <div id="demo">00:00</div>
    <div id="progress-bar"><div id="progress-done"></div></div>

    <script>
      const client = supabase.createClient(SB_URL, SB_KEY);
      const beep5 = new Audio("./file/countdown.mp3");
      const beepEnd = new Audio("./file/beep-09.mp3");

      let timerInterval;
      let lastKnownData = null;

      function syncTimer() {
        if (!lastKnownData || lastKnownData.timer_status !== "running") return;

        const target = new Date(lastKnownData.timer_end).getTime();
        const now = new Date().getTime();
        const diff = Math.ceil((target - now) / 1000);

        if (diff <= 0) {
          document.getElementById("demo").innerText = "00:00";
          document.getElementById("progress-done").style.width = "0%";
          if (diff === 0) beepEnd.play();
          return;
        }

        const m = Math.floor(diff / 60);
        const s = diff % 60;
        document.getElementById("demo").innerText = `${m}:${s < 10 ? "0" + s : s}`;

        const totalSecs = lastKnownData.interval_mins * 60;
        document.getElementById("progress-done").style.width = `${(diff / totalSecs) * 100}%`;

        if (diff === 5) beep5.play();
      }

      // Main Listener
      client
        .channel("global-sync")
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "live_scores" },
          (payload) => {
            lastKnownData = payload.new;
            console.log("Sync Received from Server");
          }
        )
        .subscribe();

      // High-frequency UI update (keeps the visual smooth)
      setInterval(syncTimer, 100);

      // Fetch initial state on load
      async function loadInitial() {
        const { data } = await client.from("live_scores").select("*").eq("id", 1).single();
        lastKnownData = data;
      }
      loadInitial();
    </script>
  </body>
</html>
