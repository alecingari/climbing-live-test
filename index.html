<!DOCTYPE HTML>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Arial Black', sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        #demo { line-height: 0.8; text-align: center; transition: color 0.3s, font-size 0.1s; width: 100vw; }
        #status-text { font-size: 4vw; color: #444; text-transform: uppercase; margin-bottom: 10px; }
        #progress-bar { position: absolute; bottom: 0; width: 100%; height: 30px; background: #111; display: none; }
        #progress-done { height: 100%; background: #fff; width: 0%; transition: width 0.2s linear; }
    </style>
</head>
<body>
    <div id="status-text">OFFLINE</div>
    <div id="demo">0:00</div>
    <div id="progress-bar"><div id="progress-done"></div></div>

    <script>
        const client = supabase.createClient(SB_URL, SB_KEY);
        const b1 = new Audio("./file/beep-1.mp3");
        const b5 = new Audio("./file/countdown.mp3");
        const bEnd = new Audio("./file/beep-09.mp3");

        let syncData = null;
        let lastLoggedSec = -1;

        // Auto Font Size Logic
        function adjustFontSize(text) {
            const len = text.length;
            let size = 40; // Default for short text
            if (len > 4) size = 30;
            if (len > 6) size = 20;
            document.getElementById("demo").style.fontSize = size + "vw";
        }

        function render(sec, total, label, color) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            const timeStr = `${m}:${s < 10 ? '0' + s : s}`;
            
            const display = document.getElementById("demo");
            display.innerText = timeStr;
            display.style.color = color;
            adjustFontSize(timeStr);

            document.getElementById("status-text").innerText = label;
            
            // Progress Bar Logic
            const bar = document.getElementById("progress-bar");
            if (syncData?.show_progress) {
                bar.style.display = "block";
                document.getElementById("progress-done").style.width = `${(sec/total)*100}%`;
                document.getElementById("progress-done").style.backgroundColor = color;
            } else {
                bar.style.display = "none";
            }

            if (sec !== lastLoggedSec) {
                lastLoggedSec = sec;
                if (sec === 60) b1.play();
                if (sec === 5) b5.play();
                if (sec === 0) bEnd.play();
            }
        }

        function tick() {
            if (!syncData || syncData.timer_status !== 'running') {
                render(0, 1, "READY", "#222");
                return;
            }
            const now = new Date().getTime();
            const masterStart = new Date(syncData.timer_end).getTime();

            if (now < masterStart) {
                const diff = Math.ceil((masterStart - now) / 1000);
                render(diff, diff, "STARTING IN...", "#38bdf8");
                return;
            }

            const workSecs = syncData.interval_mins * 60;
            const restSecs = parseInt(syncData.rest_secs);
            const elapsed = Math.floor((now - masterStart) / 1000);

            if (syncData.final_mode) {
                const remain = workSecs - elapsed;
                if (remain <= 0) render(0, 1, "FINISH", "#ef4444");
                else render(remain, workSecs, "WORK", "#ffffff");
            } else {
                const cycle = workSecs + restSecs;
                const timeInCycle = elapsed % cycle;
                if (timeInCycle < workSecs) {
                    render(workSecs - timeInCycle, workSecs, "WORK", "#ffffff");
                } else {
                    // Rest display: Only show seconds as requested
                    const restLeft = restSecs - (timeInCycle - workSecs);
                    const display = document.getElementById("demo");
                    display.innerText = restLeft;
                    display.style.color = "#ef4444";
                    adjustFontSize(restLeft.toString());
                    document.getElementById("status-text").innerText = "REST";
                }
            }
        }

        client.channel('master').on('postgres_changes', {event:'UPDATE', schema:'public', table:'live_scores'}, p => syncData = p.new).subscribe();
        async function init() {
            const { data } = await client.from('live_scores').select('*').eq('id', 1).single();
            syncData = data;
            setInterval(tick, 100);
        }
        init();
    </script>
</body>
</html>
