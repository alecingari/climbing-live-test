<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Live Timer</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
      :root {
        --bg: #000;
        --text: #fff;
        --accent: #38bdf8;
        --red: #ef4444;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Arial Black", sans-serif;
        overflow: hidden;
      }

      #all {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        position: relative;
      }

      #broadcast-overlay {
        position: absolute;
        top: 6vh;
        width: 90%;
        height: 20vh;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        z-index: 10;
      }

      #broadcast-text {
        color: var(--accent);
        text-transform: uppercase;
        line-height: 1.1;
        word-wrap: break-word;
      }

      #timer {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      }

      #demo {
        white-space: nowrap;
        line-height: 0.8;
      }

      #progress-bar {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 3vh;
        background: #111;
        visibility: hidden;
      }
      #progress-done {
        width: 0%;
        height: 100%;
        background: var(--accent);
        transition: width 1s linear;
      }
    </style>
  </head>
  <body>
    <div id="all">
      <div id="broadcast-overlay"><div id="broadcast-text"></div></div>
      <div id="timer"><span id="demo">0:00</span></div>
      <div id="progress-bar"><div id="progress-done"></div></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
