<!DOCTYPE html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" href="./file/img_136578.png" />
    <title>Boulder Timer Live</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
      :root {
        --bg: #000;
        --text: #fff;
        --accent: #38bdf8;
        --red: #ef4444;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Arial Black", sans-serif;
        overflow: hidden;
      }

      #all {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        position: relative;
      }

      #timer {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        flex-grow: 1;
      }

      #demo {
        white-space: nowrap;
        line-height: 0.9;
        text-align: center;
        transition: color 0.3s ease;
      }

      /* Broadcast Message Overlay */
      #broadcast-overlay {
        position: absolute;
        top: 5%;
        width: 90%;
        text-align: center;
        font-size: 4vw;
        color: var(--accent);
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      }

      /* Progress Bar */
      #progress-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4vh;
        background: #1e293b;
        visibility: hidden;
      }
      #progress-done {
        width: 0%;
        height: 100%;
        background: var(--accent);
        transition: width 1s linear;
      }
    </style>
  </head>
  <body>
    <div id="all">
      <div id="broadcast-overlay"></div>

      <div id="timer">
        <span id="demo">0:00</span>
      </div>

      <div id="progress-bar">
        <div id="progress-done"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
