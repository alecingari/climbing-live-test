<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
      body {
        background: #1a1a1a;
        color: white;
        font-family: sans-serif;
        padding: 20px;
      }
      .panel {
        background: #2a2a2a;
        padding: 20px;
        border-radius: 12px;
        max-width: 400px;
        margin: auto;
      }
      .opt {
        margin: 15px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      input[type="number"] {
        background: #444;
        border: 1px solid #555;
        color: white;
        padding: 8px;
        border-radius: 4px;
        width: 60px;
        text-align: center;
      }
      button {
        width: 100%;
        padding: 15px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-start {
        background: #22c55e;
        color: white;
      }
      .btn-stop {
        background: #ef4444;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>Competition Master</h2>
      <div class="opt">
        <label>Interval (min):</label>
        <input id="time" type="number" value="5" />
      </div>
      <div class="opt">
        <label>Rest (sec):</label>
        <input id="rest" type="number" value="15" />
      </div>
      <div class="opt">
        <label>Ora Inizio (HH:MM):</label>
        <div style="display: flex; gap: 5px">
          <input id="h" type="number" placeholder="HH" />
          <input id="m" type="number" placeholder="MM" />
        </div>
      </div>
      <div class="opt">
        <label>Final Mode (No Rest):</label>
        <input type="checkbox" id="finalMode" />
      </div>
      <button class="btn-start" onclick="updateMaster(true)">START / SYNC ALL</button>
      <button class="btn-stop" onclick="updateMaster(false)">RESET ALL</button>
    </div>

    <script>
      const remoteClient = supabase.createClient(SB_URL, SB_KEY);

      async function updateMaster(running) {
        let startTime;
        const h = document.getElementById("h").value;
        const m = document.getElementById("m").value;

        if (running) {
          if (h !== "" && m !== "") {
            let target = new Date();
            target.setHours(h, m, 0, 0);
            if (target < new Date()) target.setDate(target.getDate() + 1);
            startTime = target.toISOString();
          } else {
            startTime = new Date().toISOString();
          }
        } else {
          startTime = null;
        }

        await remoteClient
          .from("live_scores")
          .update({
            timer_status: running ? "running" : "stopped",
            timer_end: startTime, // This acts as the "Master Start Time"
            interval_mins: document.getElementById("time").value,
            rest_secs: document.getElementById("rest").value,
            final_mode: document.getElementById("finalMode").checked,
          })
          .eq("id", 1);
      }
    </script>
  </body>
</html>
