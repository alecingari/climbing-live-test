<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
      body {
        background: #111827;
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      .card {
        background: #1f2937;
        padding: 25px;
        border-radius: 15px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }
      input {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #374151;
        color: white;
        font-size: 1.5rem;
        text-align: center;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 20px;
        margin-top: 15px;
        border-radius: 10px;
        border: none;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .start {
        background: #10b981;
        color: white;
      }
      .stop {
        background: #ef4444;
        color: white;
      }
      label {
        color: #9ca3af;
        font-size: 0.9rem;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <label>Work Interval (Mins)</label>
      <input id="time" type="number" value="5" min="1" />

      <label>Rest Interval (Secs)</label>
      <input id="rest" type="number" value="15" min="0" />

      <button class="start" onclick="controlTimer('running')">START CLOCK</button>
      <button class="stop" onclick="controlTimer('stopped')">RESET / STOP</button>
    </div>

    <script>
      const SB_URL = "https://lissscvlvmzjswsykvoq.supabase.co";
      const SB_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxpc3NzY3Zsdm16anN3c3lrdm9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0ODAyNTAsImV4cCI6MjA5MDA1NjI1MH0.Muj9vosIuV1bFJQ5_iR9JkQ22gzvBcc70kbjnBFwBbM";
      const supabaseRemote = supabase.createClient(SB_URL, SB_KEY);

      async function controlTimer(status) {
        const mins = document.getElementById("time").value;
        const rest = document.getElementById("rest").value;
        // Calculate when the work period ends
        const endTime = new Date(Date.now() + mins * 60000).toISOString();

        const { error } = await supabaseRemote
          .from("live_scores")
          .update({
            timer_status: status,
            interval_mins: mins,
            rest_secs: rest,
            timer_end: endTime,
          })
          .eq("id", 1);

        if (error) alert(error.message);
      }
    </script>
  </body>
</html>
