<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #38bdf8;
        --green: #22c55e;
        --red: #ef4444;
      }
      body {
        background: var(--bg);
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 15px;
        margin: 0;
      }

      /* Monitor Section */
      .monitor {
        width: 100%;
        max-width: 400px;
        background: #000;
        border-radius: 15px;
        padding: 15px;
        margin-bottom: 12px;
        text-align: center;
        border: 1px solid #334155;
        box-sizing: border-box;
      }
      #mon-label {
        font-size: 0.7rem;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      #mon-timer {
        font-family: "Arial Black", sans-serif;
        line-height: 1.1;
        font-size: 2.8rem;
        margin: 5px 0;
        color: #fff;
      }
      #mon-broadcast {
        font-size: 0.85rem;
        color: var(--accent);
        font-weight: bold;
        min-height: 1.2em;
        word-wrap: break-word;
      }

      /* Panels */
      .panel {
        background: var(--card);
        padding: 18px;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        box-sizing: border-box;
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 0.65rem;
        color: var(--accent);
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 10px;
        display: block;
      }

      /* Expanded Broadcast Area */
      .broadcast-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      textarea {
        background: #334155;
        border: 1px solid #475569;
        color: white;
        padding: 12px;
        border-radius: 10px;
        font-size: 1rem;
        width: 100%;
        box-sizing: border-box;
        resize: none;
        font-family: inherit;
      }
      .broadcast-btns {
        display: flex;
        gap: 8px;
      }

      /* Inputs */
      .opt {
        margin: 8px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.2);
        padding: 10px 14px;
        border-radius: 12px;
      }
      label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #94a3b8;
      }
      input[type="number"] {
        background: #334155;
        border: 1px solid #475569;
        color: white;
        padding: 8px;
        border-radius: 8px;
        font-size: 1.1rem;
        width: 65px;
        text-align: center;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .grid-time {
        display: flex;
        gap: 6px;
      }
      .grid-time input {
        width: 50px;
      }

      /* Buttons */
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .btn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn:disabled {
        opacity: 0.15;
        cursor: not-allowed;
        filter: grayscale(1);
      }

      .btn-start {
        background: var(--green);
        color: white;
      }
      .btn-stop {
        background: var(--red);
        color: white;
      }
      .btn-push {
        background: var(--accent);
        color: #0f172a;
        font-size: 0.85rem;
        padding: 12px;
      }
      .btn-clear {
        background: #475569;
        color: white;
        font-size: 0.85rem;
        padding: 12px;
      }

      .lock-container {
        display: flex;
        justify-content: center;
        margin-top: 15px;
      }
      .btn-lock {
        width: auto;
        min-width: 180px;
        padding: 10px 20px;
        font-size: 0.75rem;
        background: #475569;
        color: #f1f5f9;
        border-radius: 30px;
        border: 2px solid transparent;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
      }
      .btn-lock.is-locked {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
        border-color: var(--red);
      }
    </style>
  </head>
  <body>
    <div class="monitor">
      <div id="mon-label">LIVE PREVIEW</div>
      <div id="mon-timer">0:00</div>
      <div id="mon-broadcast"></div>
    </div>

    <div class="panel">
      <span class="section-title">Broadcast Message</span>
      <div class="broadcast-controls">
        <textarea id="broadcastInput" rows="2" placeholder="Enter long message..."></textarea>
        <div class="broadcast-btns">
          <button class="btn btn-push" style="flex: 2" onclick="pushBroadcast()">
            PUSH TO SCREEN
          </button>
          <button class="btn btn-clear" style="flex: 1" onclick="clearBroadcast()">
            RESET TEXT
          </button>
        </div>
      </div>
    </div>

    <div class="panel">
      <span class="section-title">Timer Setup</span>
      <div class="opt">
        <label>INTERVAL (MIN)</label>
        <input id="time" type="number" value="5" />
      </div>
      <div class="opt">
        <label>REST (SEC)</label>
        <input id="rest" type="number" value="15" />
      </div>
      <div class="opt">
        <label>START TIME</label>
        <div class="grid-time">
          <input id="h" type="number" placeholder="HH" />
          <input id="m" type="number" placeholder="MM" />
        </div>
      </div>

      <div style="display: flex; gap: 10px">
        <div class="opt" style="flex: 1; margin: 5px 0">
          <label>FINAL</label>
          <input type="checkbox" id="finalMode" />
        </div>
        <div class="opt" style="flex: 1; margin: 5px 0">
          <label>PROGRESS</label>
          <input type="checkbox" id="showProgress" />
        </div>
      </div>

      <div class="btn-row">
        <button id="startBtn" class="btn btn-start" onclick="updateMaster(true)">START</button>
        <button id="stopBtn" class="btn btn-stop" onclick="updateMaster(false)">RESET</button>
      </div>

      <div class="lock-container">
        <button id="lockBtn" class="btn btn-lock" onclick="toggleDbLock()">Tap to Lock</button>
      </div>
    </div>

    <script>
      const client = supabase.createClient(SB_URL, SB_KEY);
      let syncData = null;

      async function toggleDbLock() {
        const newLockStatus = !syncData.is_locked;
        await client.from("live_scores").update({ is_locked: newLockStatus }).eq("id", 1);
      }

      function updateLockUI(locked) {
        const startBtn = document.getElementById("startBtn"),
          stopBtn = document.getElementById("stopBtn"),
          lockBtn = document.getElementById("lockBtn");
        if (locked) {
          startBtn.disabled = true;
          stopBtn.disabled = true;
          lockBtn.innerHTML = "🔒 Tap to Unlock";
          lockBtn.classList.add("is-locked");
        } else {
          startBtn.disabled = false;
          stopBtn.disabled = false;
          lockBtn.innerHTML = "🔓 Tap to Lock";
          lockBtn.classList.remove("is-locked");
        }
      }

      async function pushBroadcast() {
        const text = document.getElementById("broadcastInput").value;
        await client.from("live_scores").update({ broadcast_text: text }).eq("id", 1);
      }

      async function clearBroadcast() {
        document.getElementById("broadcastInput").value = "";
        await client.from("live_scores").update({ broadcast_text: "" }).eq("id", 1);
      }

      async function updateMaster(running) {
        if (syncData.is_locked) return;
        let startTime = null;
        const h = document.getElementById("h").value,
          m = document.getElementById("m").value;
        if (running) {
          if (h !== "" && m !== "") {
            let t = new Date();
            t.setHours(h, m, 0, 0);
            if (t < new Date()) t.setDate(t.getDate() + 1);
            startTime = t.toISOString();
          } else {
            startTime = new Date().toISOString();
          }
        }
        await client
          .from("live_scores")
          .update({
            timer_status: running ? "running" : "stopped",
            timer_end: startTime,
            interval_mins: document.getElementById("time").value,
            rest_secs: document.getElementById("rest").value,
            final_mode: document.getElementById("finalMode").checked,
            show_progress: document.getElementById("showProgress").checked,
          })
          .eq("id", 1);
      }

      function format(s) {
        const m = Math.floor(s / 60),
          sec = s % 60;
        return `${m}:${sec < 10 ? "0" + sec : sec}`;
      }

      function tick() {
        if (!syncData) return;
        document.getElementById("mon-broadcast").innerText = syncData.broadcast_text || "";
        updateLockUI(syncData.is_locked);

        const display = document.getElementById("mon-timer");
        if (syncData.timer_status !== "running") {
          display.innerText = "0:00";
          return;
        }

        const now = Date.now(),
          master = new Date(syncData.timer_end).getTime();
        if (now < master) {
          display.innerText = Math.ceil((master - now) / 1000);
        } else {
          const work = syncData.interval_mins * 60,
            rest = parseInt(syncData.rest_secs);
          const elapsed = Math.floor((now - master) / 1000);
          if (syncData.final_mode) {
            const r = Math.max(0, work - elapsed);
            display.innerText = format(r);
          } else {
            const cycle = work + rest,
              time = elapsed % cycle;
            display.innerText = time < work ? format(work - time) : rest - (time - work);
          }
        }
      }

      client
        .channel("master")
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "live_scores" },
          (p) => {
            syncData = p.new;
            tick();
          }
        )
        .subscribe();

      async function init() {
        const { data } = await client.from("live_scores").select("*").eq("id", 1).single();
        syncData = data;
        tick();
        setInterval(tick, 200);
      }
      init();
    </script>
  </body>
</html>
