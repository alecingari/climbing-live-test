<!DOCTYPE html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #38bdf8;
        --green: #22c55e;
        --red: #ef4444;
      }
      body {
        background: var(--bg);
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
        margin: 0;
      }

      /* LIVE MONITOR: Matches index.html logic */
      .monitor {
        width: 100%;
        max-width: 400px;
        height: 140px;
        background: #000;
        border-radius: 15px;
        margin-bottom: 12px;
        border: 2px solid #334155;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #mon-label {
        position: absolute;
        top: 5px;
        left: 10px;
        font-size: 0.6rem;
        color: #475569;
        font-weight: 800;
      }

      #mon-broadcast {
        width: 80%;
        text-align: center;
        font-size: 0.7rem;
        color: var(--accent);
        font-weight: 800;
        text-transform: uppercase;
        margin-top: 10px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      #mon-timer-container {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }
      #mon-timer {
        font-family: "Arial Black", sans-serif;
        font-size: 3rem;
        line-height: 1;
        color: #fff;
      }

      /* Controls */
      .panel {
        background: var(--card);
        padding: 15px;
        border-radius: 18px;
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
        margin-bottom: 10px;
      }
      .section-title {
        font-size: 0.6rem;
        color: var(--accent);
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 8px;
        display: block;
      }

      textarea {
        background: #334155;
        border: 1px solid #475569;
        color: white;
        padding: 10px;
        border-radius: 10px;
        font-size: 0.9rem;
        width: 100%;
        box-sizing: border-box;
        resize: none;
      }
      .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .btn {
        border: none;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-push {
        background: var(--accent);
        color: #0f172a;
        padding: 10px;
        flex: 2;
        font-size: 0.8rem;
      }
      .btn-clear {
        background: #475569;
        color: white;
        padding: 10px;
        flex: 1;
        font-size: 0.8rem;
      }

      .opt {
        margin: 6px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.2);
        padding: 8px 12px;
        border-radius: 10px;
      }
      input[type="number"] {
        background: #334155;
        border: 1px solid #475569;
        color: white;
        padding: 5px;
        border-radius: 5px;
        width: 50px;
        text-align: center;
      }

      .btn-main {
        width: 100%;
        padding: 15px;
        font-size: 1rem;
        margin-top: 10px;
        color: white;
      }
      .btn-start {
        background: var(--green);
      }
      .btn-stop {
        background: var(--red);
      }
      .is-locked {
        opacity: 0.3;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="monitor" id="monitorBox">
      <div id="mon-label">LIVE PREVIEW</div>
      <div id="mon-broadcast"></div>
      <div id="mon-timer-container">
        <div id="mon-timer">0:00</div>
      </div>
    </div>

    <div class="panel" id="ctrlPanel">
      <span class="section-title">Broadcast</span>
      <textarea id="broadcastInput" rows="2" placeholder="Message..."></textarea>
      <div class="btn-row">
        <button class="btn btn-push" onclick="pushBroadcast()">PUSH</button>
        <button class="btn btn-clear" onclick="clearBroadcast()">RESET</button>
      </div>
    </div>

    <div class="panel" id="timerPanel">
      <span class="section-title">Timer Setup</span>
      <div class="opt"><label>WORK (MIN)</label><input id="time" type="number" value="5" /></div>
      <div class="opt"><label>REST (SEC)</label><input id="rest" type="number" value="15" /></div>
      <div style="display: flex; gap: 10px">
        <div class="opt" style="flex: 1">
          <label>FINAL</label><input type="checkbox" id="finalMode" />
        </div>
        <div class="opt" style="flex: 1">
          <label>BAR</label><input type="checkbox" id="showProgress" />
        </div>
      </div>
      <div class="btn-row">
        <button id="startBtn" class="btn btn-main btn-start" onclick="updateMaster(true)">
          START
        </button>
        <button id="stopBtn" class="btn btn-main btn-stop" onclick="updateMaster(false)">
          RESET
        </button>
      </div>
      <button
        id="lockBtn"
        style="
          width: 100%;
          background: none;
          border: none;
          color: #475569;
          font-size: 0.7rem;
          margin-top: 10px;
        "
        onclick="toggleDbLock()"
      >
        TAP TO LOCK DATABASE
      </button>
    </div>

    <script>
      const client = supabase.createClient(SB_URL, SB_KEY);
      let syncData = null;

      async function pushBroadcast() {
        const val = document.getElementById("broadcast-text")
          ? ""
          : document.getElementById("broadcastInput").value;
        await client
          .from("live_scores")
          .update({ broadcast_text: document.getElementById("broadcastInput").value })
          .eq("id", 1);
      }

      async function clearBroadcast() {
        document.getElementById("broadcastInput").value = "";
        await client.from("live_scores").update({ broadcast_text: "" }).eq("id", 1);
      }

      async function updateMaster(running) {
        await client
          .from("live_scores")
          .update({
            timer_status: running ? "running" : "stopped",
            timer_end: running ? new Date().toISOString() : null,
            interval_mins: document.getElementById("time").value,
            rest_secs: document.getElementById("rest").value,
            final_mode: document.getElementById("finalMode").checked,
            show_progress: document.getElementById("showProgress").checked,
          })
          .eq("id", 1);
      }

      async function toggleDbLock() {
        await client.from("live_scores").update({ is_locked: !syncData.is_locked }).eq("id", 1);
      }

      function format(s) {
        const m = Math.floor(s / 60),
          sec = s % 60;
        return `${m}:${sec < 10 ? "0" + sec : sec}`;
      }

      function tick() {
        if (!syncData) return;

        // 1. Update Monitor UI (Colors and Text)
        const monText = document.getElementById("mon-broadcast");
        const monTimer = document.getElementById("mon-timer");
        const monContainer = document.getElementById("mon-timer-container");
        const lockBtn = document.getElementById("lockBtn");

        monText.innerText = syncData.broadcast_text || "";
        monText.style.opacity = syncData.broadcast_text ? "1" : "0";

        // Match the "Push Down" logic
        monContainer.style.transform = syncData.broadcast_text
          ? "translateY(10px)"
          : "translateY(0)";

        // Lock UI
        lockBtn.innerText = syncData.is_locked ? "🔒 DATABASE LOCKED" : "🔓 TAP TO LOCK DATABASE";
        document.getElementById("ctrlPanel").classList.toggle("is-locked", syncData.is_locked);
        document.getElementById("timerPanel").classList.toggle("is-locked", syncData.is_locked);

        if (syncData.timer_status !== "running") {
          monTimer.innerText = "0:00";
          monTimer.style.color = "#334155";
          return;
        }

        const now = Date.now(),
          master = new Date(syncData.timer_end).getTime();
        if (now < master) {
          monTimer.innerText = format(Math.ceil((master - now) / 1000));
          monTimer.style.color = "#38bdf8";
        } else {
          const work = syncData.interval_mins * 60,
            rest = parseInt(syncData.rest_secs);
          const elapsed = Math.floor((now - master) / 1000);
          if (syncData.final_mode) {
            const rem = Math.max(0, work - elapsed);
            monTimer.innerText = format(rem);
            monTimer.style.color = rem <= 10 ? "#ef4444" : "#fff";
          } else {
            const cycle = work + rest,
              t = elapsed % cycle;
            if (t < work) {
              monTimer.innerText = format(work - t);
              monTimer.style.color = "#fff";
            } else {
              monTimer.innerText = rest - (t - work);
              monTimer.style.color = "#ef4444";
            }
          }
        }
      }

      client
        .channel("any")
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "live_scores" },
          (p) => {
            syncData = p.new;
            tick();
          }
        )
        .subscribe();

      async function init() {
        const { data } = await client.from("live_scores").select("*").eq("id", 1).single();
        syncData = data;
        tick();
        setInterval(tick, 200);
      }
      init();
    </script>
  </body>
</html>
