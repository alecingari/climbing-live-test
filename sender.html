<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="config.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
      body {
        background: #1a1a1a;
        color: white;
        font-family: sans-serif;
        padding: 20px;
      }
      .panel {
        background: #2a2a2a;
        padding: 20px;
        border-radius: 12px;
        max-width: 400px;
        margin: auto;
      }
      .opt {
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      input {
        background: #444;
        border: 1px solid #555;
        color: white;
        padding: 8px;
        border-radius: 4px;
        width: 60px;
        text-align: center;
      }
      button {
        width: 100%;
        padding: 15px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-start {
        background: #22c55e;
        color: white;
      }
      .btn-stop {
        background: #ef4444;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>Timer Control</h2>
      <div class="opt">
        <label>Interval (min):</label>
        <input id="time" type="number" value="5" />
      </div>
      <div class="opt">
        <label>Rest (sec):</label>
        <input id="rest" type="number" value="15" />
      </div>
      <div class="opt">
        <label>Start at (HH:MM):</label>
        <div style="display: flex; gap: 5px">
          <input id="h" type="number" placeholder="HH" min="0" max="23" />
          <input id="m" type="number" placeholder="MM" min="0" max="59" />
        </div>
      </div>
      <button class="btn-start" onclick="sendTimer('running')">START / SYNC ALL</button>
      <button class="btn-stop" onclick="sendTimer('stopped')">STOP / RESET</button>
    </div>

    <script>
      const remoteClient = supabase.createClient(SB_URL, SB_KEY);

      async function sendTimer(status) {
        let endTime;
        const mins = document.getElementById("time").value;
        const h = document.getElementById("h").value;
        const m = document.getElementById("m").value;

        if (status === "running") {
          if (h !== "" && m !== "") {
            // Start at specific time
            let target = new Date();
            target.setHours(h, m, 0, 0);
            // If time is in the past, assume tomorrow
            if (target < new Date()) target.setDate(target.getDate() + 1);
            endTime = target.toISOString();
          } else {
            // Start immediately
            endTime = new Date(Date.now() + mins * 60000).toISOString();
          }
        } else {
          endTime = new Date().toISOString();
        }

        await remoteClient
          .from("live_scores")
          .update({
            timer_status: status,
            interval_mins: mins,
            rest_secs: document.getElementById("rest").value,
            timer_end: endTime,
          })
          .eq("id", 1);
      }

      // Force a sync heartbeat every 1 minute
      setInterval(() => {
        remoteClient
          .from("live_scores")
          .select("timer_status")
          .eq("id", 1)
          .then(() => {
            console.log("Heartbeat sync sent to server");
          });
      }, 60000);
    </script>
  </body>
</html>
